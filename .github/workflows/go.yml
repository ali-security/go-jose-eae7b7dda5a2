name: Go

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated top-level test names to run (empty = full suite)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        GO_VERSION:
          - "1.24.x"
          - "1.25.x"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go ${{ matrix.GO_VERSION }}
      uses: actions/setup-go@v6
      with:
        go-version: "${{ matrix.GO_VERSION }}"

    - name: Build
      run: go build -v ./...

    - name: Test
      run: |
        set -eo pipefail
        if [ -n "${{ inputs.test-filter }}" ]; then
          go test -v -run "^($(echo "${{ inputs.test-filter }}" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
          for t in ${{ inputs.test-filter }}; do grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || exit 1; done
        else
          go test -v ./... 2>&1 | tee "$RUNNER_TEMP/full.log"
          awk '/--- PASS/{p++} /--- FAIL/{f++} /--- SKIP/{s++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$RUNNER_TEMP/full.log"
        fi

    - name: Create module zip
      if: matrix.GO_VERSION == '1.24.x'
      run: |
        set -eux
        helper="$(mktemp -d)"
        cat > "$helper/create_mod.go" <<'EOF'
        package main

        import (
        "log"
        "os"

        "golang.org/x/mod/module"
        "golang.org/x/mod/zip"
        )

        func main() {
        m := module.Version{Path: os.Args[1], Version: os.Args[2]}
        f, err := os.Create(os.Args[4])
        if err != nil {
        log.Fatal(err)
        }
        defer f.Close()
        if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
        log.Fatal(err)
        }
        }
        EOF
        (cd "$helper" && go mod init example.com/mod && go get golang.org/x/mod@v0.24.0 && go build -o create_mod .)
        mkdir -p "$RUNNER_TEMP/out"
        "$helper/create_mod" github.com/go-jose/go-jose/v4 v4.1.4 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v4.1.4.zip"
        unzip -l "$RUNNER_TEMP/out/v4.1.4.zip"

    - name: Upload module zip
      if: matrix.GO_VERSION == '1.24.x'
      uses: actions/upload-artifact@v4
      with:
        name: module-zip
        path: ${{ runner.temp }}/out/v4.1.4.zip
        if-no-files-found: error

  govulncheck:
    # Disabled on the seal fork: govulncheck@latest is a static vulnerability
    # scan against the live vuln DB, not a test of this module's code.
    if: false
    strategy:
      matrix:
        GO_VERSION:
          # We only need to test vulns on one version
          - "1.25.x"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          # When Go produces a security release, we want govulncheck to run
          # against the most recently released Go version.
          check-latest: true
          go-version: "${{ matrix.GO_VERSION }}"

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
